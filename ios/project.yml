name: Aftermap
packages:
  MapLibre:
    url: https://github.com/maplibre/maplibre-gl-native-distribution
    exactVersion: 7.0.0
options:
  bundleIdPrefix: com.makeuc
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.4"
settings:
  base:
    SWIFT_VERSION: "5.10"
    DEVELOPMENT_TEAM: ""
targets:
  Aftermap:
    type: application
    platform: iOS
    sources:
      - path: Aftermap
    dependencies:
      - package: MapLibre
    info:
      path: Aftermap/Info.plist
      properties:
        CFBundleDisplayName: Gaslight Maps
        LSApplicationCategoryType: public.app-category.navigation
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSCameraUsageDescription: "Gaslight Maps captures incident evidence photos you choose to submit."
        NSLocalNetworkUsageDescription: "Gaslight Maps can connect to an incident server on your local network."
        NSLocationWhenInUseUsageDescription: "Gaslight Maps uses your location to choose route endpoints and place field evidence."
        NSMicrophoneUsageDescription: "Gaslight Maps records your incident report while speech transcription is active."
        NSPhotoLibraryUsageDescription: "Gaslight Maps lets you select an incident evidence photo when the camera is unavailable."
        NSSpeechRecognitionUsageDescription: "Gaslight Maps transcribes your spoken incident report into editable text."
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_BUNDLE_IDENTIFIER: com.makeuc.aftermap
        PRODUCT_MODULE_NAME: Aftermap
        DEFINES_MODULE: YES
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
    scheme:
      testTargets:
        - AftermapTests
        - AftermapUITests
  AftermapTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: AftermapTests
    dependencies:
      - target: Aftermap
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.makeuc.aftermap.tests
        GENERATE_INFOPLIST_FILE: YES
  AftermapUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: AftermapUITests
    dependencies:
      - target: Aftermap
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.makeuc.aftermap.uitests
        GENERATE_INFOPLIST_FILE: YES
