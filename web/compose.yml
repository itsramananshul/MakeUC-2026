services:
  api:
    build: .
    environment:
      AFTERMAP_OPERATOR_KEY: ${AFTERMAP_OPERATOR_KEY:?Set the workspace operator key}
      AFTERMAP_DB_RESTORE_URL: ${AFTERMAP_DB_RESTORE_URL:-}
      AFTERMAP_DB_RESTORE_TOKEN: ${AFTERMAP_DB_RESTORE_TOKEN:-}
      AFTERMAP_DB_RESTORE_SHA256: ${AFTERMAP_DB_RESTORE_SHA256:-}
      NODEODM_URL: http://nodeodm:3000
    expose:
      - "3000"
    volumes:
      - gaslight-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/incidents').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  nodeodm:
    image: opendronemap/nodeodm:3.6.2
    volumes:
      - drone-data:/var/www/data
    cpus: 2
    mem_limit: 4g
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/info',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 25s

volumes:
  gaslight-data:
  drone-data:
